<style>
:root{--noche:#070b14;--crema:#f4efe2;--oro:#e0b85a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--noche);color:var(--crema);font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
body{display:grid;place-items:center}
#stage{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;overflow:hidden;background:#222}
#stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#fondo{z-index:0}#mesa{z-index:2}
iframe{position:absolute;z-index:1;border:0;background:transparent;pointer-events:none;width:26%;height:66%;top:18%}
#f-simon{left:19.5%}#f-alicia{left:54.5%}
#sub{position:absolute;z-index:3;top:2.2%;left:50%;transform:translateX(-50%);width:62%;min-height:7%;padding:.7em 1.1em;border-radius:12px;background:rgba(6,10,20,.78);border:1px solid rgba(224,184,90,.35);font-size:clamp(11px,1.45vw,22px);line-height:1.4;text-align:center;display:none}
#sub b{color:var(--oro);margin-right:.4em}
#barra{position:absolute;z-index:3;left:0;right:0;bottom:3.2%;display:flex;justify-content:center;gap:3%}
.hablar{display:flex;align-items:center;gap:.6em;cursor:pointer;padding:.6em 1.3em;border-radius:999px;font:inherit;font-weight:600;font-size:clamp(11px,1.3vw,20px);color:var(--crema);background:rgba(20,12,6,.72);border:2px solid rgba(224,184,90,.55);transition:.15s}
.hablar:hover{background:rgba(60,36,14,.9)}
.hablar[aria-pressed=true]{background:#7c1b1f;border-color:#ffd27a}
.hablar.habla{box-shadow:0 0 0 4px rgba(255,210,122,.45),0 0 28px rgba(255,210,122,.6)}
.hablar small{font-weight:400;opacity:.75}
@media (max-aspect-ratio:1/1){#stage{width:100vw}}
</style>
</head>

<div id="sub" role="status" aria-live="polite"></div>
<div id="barra">
 <button class="hablar" id="b-simon" aria-pressed="false">🎙 Hablar con Simón <small>psicoanálisis</small></button>
 <button class="hablar" id="b-alicia" aria-pressed="false">🎙 Hablar con Alicia <small>formación docente</small></button>
</div>
</div>
<script>
const P = {
  simon:  { f: document.getElementById('f-simon'),  b: document.getElementById('b-simon'),  n: 'Simón',  activo: false },
  alicia: { f: document.getElementById('f-alicia'), b: document.getElementById('b-alicia'), n: 'Alicia', activo: false }
};
const sub = document.getElementById('sub');
const otro = k => (k === 'simon' ? 'alicia' : 'simon');
function alternar(k){
  const a = P[k], o = P[otro(k)];
  if (o.activo) o.f.contentWindow.postMessage({ cmd: 'terminar' }, '*');
  a.f.contentWindow.postMessage({ cmd: a.activo ? 'terminar' : 'hablar' }, '*');
}
for (const k in P) P[k].b.addEventListener('click', () => alternar(k));
addEventListener('message', e => {
  const d = e.data; if (!d || !d.hd) return;
  const k = e.source === P.simon.f.contentWindow ? 'simon' : 'alicia', p = P[k];
  p.activo = d.activo;
  p.b.setAttribute('aria-pressed', d.activo);
  p.b.classList.toggle('habla', d.activo && d.modo === 'speaking');
  if (!d.activo) { if (!P[otro(k)].activo) sub.style.display = 'none'; return; }
  const lineas = (d.texto || '').split('\n').filter(Boolean);
  if (!lineas.length) return;
  const quien = lineas[1] === 'Vos' ? 'Vos' : p.n;
  sub.innerHTML = ''; const b = document.createElement('b'); b.textContent = quien + ':';
  sub.append(b, lineas[0]); sub.style.display = 'block';
});
</script>
